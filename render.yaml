# OPCIONAL: "Blueprint" de Render. Si lo usa (New + > Blueprint) crea la base de datos y el servicio juntos.
# Si prefiere hacerlo a mano en el panel, puede ignorar este archivo.
databases:
  - name: pos-db
    plan: free            # OJO: la base gratuita de Render EXPIRA a los 30 días. Para un negocio real use un plan de pago.
    databaseName: pos
    user: pos_user

services:
  - type: web
    name: pos-chacarita
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pos-db
          property: connectionString
      - key: API_KEY
        generateValue: true     # Render inventa la clave; cópiela del panel (Environment) para ponerla en el POS
