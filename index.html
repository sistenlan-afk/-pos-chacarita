<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS TODO COMPLETO V14.2</title>
<style>
:root{--green:#0f5d2e;--yellow:#ffb800;--bg:#f5f1e8}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg)}
.top{background:var(--green);color:white;padding:10px 15px;display:flex;justify-content:space-between}
.btn{border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
.btn-yellow{background:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:15px}
.card{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 6px #0001;cursor:pointer}
.cart{background:white;margin:10px;border-radius:12px;padding:15px}
.login{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:99}
.login-box{background:white;padding:25px;border-radius:15px;width:90%;max-width:350px}
.login-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<div id="loginScreen" class="login">
<div class="login-box">
<h2>La Chacarita POS</h2><p>TODO COMPLETO V14.2</p>
<input id="user" placeholder="Usuario - ej: JOEL">
<input id="pin" type="password" placeholder="PIN">
<button class="btn btn-yellow" style="width:100%" onclick="login()">ENTRAR</button>
</div>
</div>
<div class="top">
<div><b>La Chacarita POS</b><br><span id="userInfo">V14.2 - Conectado a Render</span></div>
<button class="btn" style="background:white" onclick="location.reload()">Salir</button>
</div>
<div style="display:flex;gap:8px;padding:10px 15px;background:white;flex-wrap:wrap">
<input id="cliente" placeholder="Cliente F6 - Mostrador" style="flex:1;padding:8px">
<input id="base" type="number" placeholder="Base $0" style="width:90px;padding:8px">
<select id="categoria" style="padding:8px"><option>General</option><option>Licores</option><option>Bebidas</option><option>Comidas</option></select>
<button class="btn btn-yellow" onclick="document.getElementById('addModal').style.display='flex'">+ Producto F2</button>
<button class="btn" style="background:#e8f5e9" onclick="verVentas()">Ventas F3</button>
</div>
<div id="productosGrid" class="grid">Cargando productos desde Render...</div>
<div class="cart">
<div>🛒 Carrito <span id="cartCount">0</span></div>
<div id="cartItems"></div>
<div style="display:flex;justify-content:space-between;font-size:20px;font-weight:bold;color:#0f5d2e;padding:10px 0"><span>Total:</span><span id="totalTxt">$0</span></div>
<button class="btn btn-yellow" style="width:100%;font-size:18px;padding:14px" onclick="cobrar()">💰 COBRAR F1 - GUARDAR EN RENDER</button>
<div id="cobradoMsg" style="color:green;font-weight:bold;margin-top:8px"></div>
</div>
<div id="addModal" class="login" style="display:none">
<div class="login-box">
<h3>Nuevo Producto - Se guarda en Render</h3>
<input id="pNombre" placeholder="Nombre ej: Arroz">
<input id="pPrecio" type="number" placeholder="Precio ej: 3500">
<input id="pStock" type="number" placeholder="Stock ej: 50">
<button class="btn btn-yellow" style="width:100%" onclick="guardarProducto()">GUARDAR</button>
<button class="btn" style="width:100%;margin-top:5px" onclick="document.getElementById('addModal').style.display='none'">Cancelar</button>
</div>
</div>
<script>
const API='';
let productos=[],carrito=[],usuarioActual=null;
async function login(){
 const nombre=document.getElementById('user').value.trim();
 const pin=document.getElementById('pin').value.trim();
 const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,pin})});
 const d=await r.json();
 if(!r.ok) return alert(d.error);
 usuarioActual=d.usuario;
 document.getElementById('loginScreen').style.display='none';
 document.getElementById('userInfo').innerText=d.usuario.nombre+' • '+d.usuario.rol;
 cargarProductos();
}
async function cargarProductos(){
 const grid=document.getElementById('productosGrid');
 const r=await fetch(API+'/api/productos'); productos=await r.json();
 if(productos.length===0){grid.innerHTML='No hay productos. Dale + Producto';return}
 grid.innerHTML=productos.map(p=>`<div class="card" onclick="addCarrito(${p.id})"><div style="font-size:30px">📦</div><b>${p.nombre}</b><div style="color:#0f5d2e;font-weight:bold">$${Number(p.precio).toLocaleString()}</div><div style="font-size:11px">Stock ${p.stock}</div></div>`).join('');
}
function addCarrito(id){
 const p=productos.find(x=>x.id===id);
 const ex=carrito.find(x=>x.id===id);
 if(ex) ex.cant++; else carrito.push({...p,cant:1});
 renderCarrito();
}
function renderCarrito(){
 document.getElementById('cartCount').innerText=carrito.length;
 let total=0;
 document.getElementById('cartItems').innerHTML=carrito.map((c,i)=>{total+=c.precio*c.cant; return `<div style="display:flex;justify-content:space-between;border-bottom:1px dashed #ddd;padding:5px"><span>${c.nombre} x${c.cant}</span><span>$${(c.precio*c.cant).toLocaleString()} <b onclick="carrito.splice(${i},1);renderCarrito()" style="color:red">X</b></span></div>`}).join('');
 document.getElementById('totalTxt').innerText='$'+total.toLocaleString();
}
async function guardarProducto(){
 const nombre=document.getElementById('pNombre').value;
 const precio=document.getElementById('pPrecio').value;
 const stock=document.getElementById('pStock').value||0;
 const categoria=document.getElementById('categoria').value;
 const r=await fetch(API+'/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,precio,stock,categoria})});
 if(r.ok){document.getElementById('addModal').style.display='none';cargarProductos();alert('Guardado en Render ✅')}
}
async function cobrar(){
 if(carrito.length===0) return alert('Vacío');
 const total=carrito.reduce((s,c)=>s+c.precio*c.cant,0);
 const cliente=document.getElementById('cliente').value||'Mostrador';
 const r=await fetch(API+'/api/ventas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({datos:{carrito,cliente},total,usuario:usuarioActual.nombre})});
 if(r.ok){document.getElementById('cobradoMsg').innerText='✅ Cobrada $'+total.toLocaleString();carrito=[];renderCarrito();}
}
async function verVentas(){
 const r=await fetch(API+'/api/ventas'); const v=await r.json();
 alert(v.slice(0,10).map(x=>`#${x.id} $${x.total} ${x.usuario}`).join('\n'));
}
</script>
</body>
</html>
