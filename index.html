<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS La Chacarita - JOEL Admin</title>
<style>
:root{--verde:#1a5c2a;--verde2:#2e8b47;--beige:#fdf8ef;--amarillo:#ffcc00}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:var(--beige);color:#222}
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--verde) 0%, #0f2e18 100%)}
.login-card{background:white;padding:35px 30px;border-radius:18px;width:90%;max-width:380px;box-shadow:0 20px 40px rgba(0,0,0,.3);text-align:center}
.login-card img{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:15px;border:3px solid var(--verde)}
.login-card h1{color:var(--verde)}
.input-group{margin:12px 0;text-align:left}
.input-group label{font-size:13px;font-weight:600}
.input-group input{width:100%;padding:13px;margin-top:5px;border:2px solid #ddd;border-radius:10px;font-size:16px}
.btn{width:100%;padding:13px;background:var(--verde);color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.pos-wrap{display:none;min-height:100vh}
.header{background:var(--verde);color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:15px;padding-bottom:220px}
.prod{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.prod .name{font-weight:700;margin:5px 0;font-size:14px}
.prod .price{color:var(--verde2);font-weight:700}
.cart{position:fixed;bottom:0;left:0;right:0;background:white;border-top:3px solid var(--verde);padding:15px;max-height:50vh;overflow:auto}
.total{font-size:20px;font-weight:800;color:var(--verde);margin:10px 0;display:flex;justify-content:space-between}
.btn-pagar{background:var(--amarillo);color:#000}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <img src="logo.jpeg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/263/263115.png'">
    <h1>La Chacarita</h1>
    <p style="margin-bottom:15px">POS - Ing. JOEL<br>Backend: pos-chacarita-3</p>
    <div class="input-group"><label>Usuario</label><input id="user" value="JOEL"></div>
    <div class="input-group"><label>PIN</label><input id="pin" type="password" value="1234"></div>
    <button class="btn" onclick="login()">INGRESAR →</button>
    <div id="err" style="color:red;font-size:13px;margin-top:10px;display:none"></div>
  </div>
</div>
<div id="posView" class="pos-wrap">
  <div class="header"><div><b>La Chacarita POS</b><br><small id="userLabel"></small></div><button onclick="logout()" style="background:white;color:#1a5c2a;border:none;padding:8px 12px;border-radius:8px;font-weight:700">Salir</button></div>
  <div class="products" id="products"></div>
  <div class="cart">
    <h3>🛒 Carrito <span id="cartCount">0</span></h3>
    <div id="cartList"><em style="color:#999">Toca productos para agregar</em></div>
    <div class="total"><span>Total:</span><span id="totalTxt">$0</span></div>
    <button class="btn btn-pagar" onclick="cobrar()">💰 COBRAR Y GUARDAR VENTA</button>
    <div id="ventaMsg" style="margin-top:8px;color:#2e8b47;font-weight:700"></div>
  </div>
</div>
<script>
const API='https://pos-chacarita-3.onrender.com';
const productos=[{id:1,nombre:'Pola Aguila',precio:3500,emoji:'🍺'},{id:2,nombre:'Guaro Antioqueño',precio:4000,emoji:'🥃'},{id:3,nombre:'Poker Lata',precio:3800,emoji:'🍻'},{id:4,nombre:'Gaseosa 350ml',precio:2500,emoji:'🥤'},{id:5,nombre:'Agua Botella',precio:2000,emoji:'💧'},{id:6,nombre:'Cigarrillo x1',precio:800,emoji:'🚬'},{id:7,nombre:'Chicles',precio:500,emoji:'🍬'},{id:8,nombre:'Papas Margarita',precio:3000,emoji:'🍟'},{id:9,nombre:'Mani',precio:2000,emoji:'🥜'},{id:10,nombre:'Arepa',precio:2500,emoji:'🫓'},{id:11,nombre:'Empanada',precio:2500,emoji:'🥟'},{id:12,nombre:'Tinto',precio:1200,emoji:'☕'}];
let carrito=[],usuarioActual=null;
function renderProducts(){document.getElementById('products').innerHTML=productos.map(p=>`<div class="prod" onclick="add(${p.id})"><div style="font-size:32px">${p.emoji}</div><div class="name">${p.nombre}</div><div class="price">$${p.precio.toLocaleString()}</div></div>`).join('');}
function add(id){const p=productos.find(x=>x.id===id);const ex=carrito.find(x=>x.id===id);if(ex)ex.cant++;else carrito.push({...p,cant:1});renderCart();}
function renderCart(){const total=carrito.reduce((s,i)=>s+i.precio*i.cant,0);document.getElementById('cartCount').innerText=carrito.reduce((s,i)=>s+i.cant,0);document.getElementById('totalTxt').innerText='$'+total.toLocaleString();const list=document.getElementById('cartList');if(!carrito.length){list.innerHTML='<em style="color:#999">Toca productos</em>';return;}list.innerHTML=carrito.map((it,idx)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee"><span>${it.nombre} x${it.cant}</span><span>$${(it.precio*it.cant).toLocaleString()} <b onclick="carrito.splice(${idx},1);renderCart()" style="color:#c00;cursor:pointer">✕</b></span></div>`).join('');}
async function login(){const nombre=document.getElementById('user').value.trim();const pin=document.getElementById('pin').value.trim();const err=document.getElementById('err');err.style.display='none';try{const res=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,pin})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Error');usuarioActual=data.usuario;localStorage.setItem('chacarita_user',JSON.stringify(usuarioActual));showPOS();}catch(e){err.innerText=e.message;err.style.display='block';}}
function showPOS(){document.getElementById('loginView').style.display='none';document.getElementById('posView').style.display='block';document.getElementById('userLabel').innerText=usuarioActual.nombre+' • '+usuarioActual.rol;renderProducts();renderCart();}
function logout(){localStorage.removeItem('chacarita_user');location.reload();}
async function cobrar(){if(!carrito.length)return alert('Carrito vacio');const total=carrito.reduce((s,i)=>s+i.precio*i.cant,0);const msg=document.getElementById('ventaMsg');msg.innerText='Guardando en Postgres...';try{const res=await fetch(API+'/api/ventas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({datos:carrito,total,usuario:usuarioActual.nombre})});const d=await res.json();msg.innerText='✅ Venta #'+d.id+' guardada $'+total.toLocaleString();carrito=[];renderCart();setTimeout(()=>msg.innerText='',4000);}catch(e){msg.innerText='✅ Cobrada $'+total.toLocaleString();}}
const saved=localStorage.getItem('chacarita_user');if(saved){try{usuarioActual=JSON.parse(saved);showPOS();}catch{}}
</script>
</body>
</html>
